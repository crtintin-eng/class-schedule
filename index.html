<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Schedule | CR Dashboard</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#1e293b;font:16px 'PT Sans',Arial,sans-serif}main{max-width:1050px;margin:auto;padding:24px 16px}header{background:#1f3a5f;color:white;padding:24px;border-radius:18px}h1{margin:0 0 6px;font-size:28px}h2{font-size:20px;margin:0}p{line-height:1.5}small{color:#687485}.tag{font-size:12px;padding:5px 9px;border-radius:6px;background:#e8edf4;color:#1f3a5f}header .tag{background:#ffffff22;color:white} .layout{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-top:16px}.panel{background:white;border:1px solid #e1e5eb;border-radius:15px;padding:16px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}button{font:inherit;cursor:pointer;border:1px solid #dce1e8;background:white;border-radius:8px;color:#1f3a5f;padding:8px}button:focus-visible{outline:3px solid #4e79a7;outline-offset:2px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.weekday{text-align:center;font-size:12px;color:#687485;padding:5px 0}.day{min-height:62px;text-align:left;display:flex;flex-direction:column;gap:5px;align-items:flex-start}.day[aria-pressed=true]{background:#1f3a5f;color:white;border-color:#1f3a5f}.today{box-shadow:inset 0 0 0 2px #4e79a7}.dots{display:flex;gap:3px;flex-wrap:wrap}.dot{width:8px;height:8px;border-radius:50%;display:inline-block}.event{border-left:4px solid var(--c);padding:9px 12px;background:#f7f8fa;margin:10px 0;border-radius:6px;overflow-wrap:anywhere}.event b{display:block}.event p{margin:5px 0;white-space:pre-wrap}.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;margin:14px 0 0}.legend span{display:flex;gap:5px;align-items:center}.status{font-size:13px;margin:12px 0 0}.error{color:#760408}a{color:#1f3a5f}footer{padding:12px 0;color:#687485;font-size:13px}@media(max-width:650px){.layout{grid-template-columns:1fr}.day{min-height:47px;padding:5px}.panel{padding:12px}main{padding:12px}h1{font-size:24px}}
</style></head><body><main><header><span class="tag">READ-ONLY STUDENT VIEW</span><h1 style="margin-top:12px">Class Schedule</h1><div>Tests · Labs · Quizzes · Notices</div></header><div class="layout"><section class="panel"><div class="toolbar"><button id="prev" aria-label="Previous month">‹</button><h2 id="month"></h2><button id="next" aria-label="Next month">›</button><button id="today">Today</button></div><div id="calendar" class="calendar"></div><div id="legend" class="legend"></div><p class="status" id="status" role="status"></p></section><section class="panel"><small>SELECTED DATE</small><h2 id="selected" style="margin-top:5px"></h2><div id="events" aria-live="polite"></div><hr style="border:0;border-top:1px solid #e1e5eb;margin:20px 0"><h2>Next 7 days</h2><div id="upcoming"></div></section></div><footer>All times are Bangladesh time (Asia/Dhaka). <a href="https://calendar.google.com/" target="_blank" rel="noopener">CR: open Google Calendar to manage events</a>.</footer></main><script>
// Configure only a dedicated public class calendar. Never use a personal calendar or secret credentials.
const CONFIG={calendarId:'',apiKey:'',timeZone:'Asia/Dhaka'};
const types={'CT':'#760408','Quiz':'#533A71','Lab':'#2F5D50','Assignment':'#B66A2C','Notice':'#4E79A7','Class':'#777777'};
const $=id=>document.getElementById(id), pad=n=>String(n).padStart(2,'0'), key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`, day=s=>new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10)), add=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n), fmt=(d,opts)=>d.toLocaleDateString('en-GB',opts);
const dateFormat=new Intl.DateTimeFormat('en-CA',{timeZone:CONFIG.timeZone,year:'numeric',month:'2-digit',day:'2-digit'});
function dhakaDate(t){const p=Object.fromEntries(dateFormat.formatToParts(new Date(t)).map(x=>[x.type,x.value]));return `${p.year}-${p.month}-${p.day}`;}
const today=day(dhakaDate(Date.now())), demo=!CONFIG.calendarId||!CONFIG.apiKey;
let selected=demo?day('2026-12-06'):today, month=new Date(selected.getFullYear(),selected.getMonth(),1), items=[], busy=false, error='', request=0;
const samples=[['2026-12-03','Quiz','Digital Electronics','10:00 AM','Sample: Room 301'],['2026-12-06','CT','Engineering Mathematics','10:00 AM','Sample: Chapters 1–2'],['2026-12-06','Lab','Biomedical Instrumentation','2:00 PM','Sample: Bring lab report'],['2026-12-08','Assignment','Circuit Analysis','All day','Sample: Submission deadline'],['2026-12-10','Notice','Makeup class announcement','All day','Sample: Check with CR']].map(([start,type,title,time,description])=>({start,end:key(add(day(start),1)),type,title,time,description}));
function typeFor(s){return Object.keys(types).find(t=>new RegExp('^\\['+t+'\\]','i').test(s))||'Class';}
function convert(e){let s=e.start?.dateTime||e.start?.date, end=e.end?.dateTime||e.end?.date;if(!s||!end)return null;let all=!!e.start.date, start=all?s:dhakaDate(s), stop=all?end:key(add(day(dhakaDate(new Date(end).getTime()-1)),1)), type=typeFor(e.summary||'');return {start,end:stop,type,title:(e.summary||'Untitled event').replace(/^\[(CT|Quiz|Lab|Assignment|Notice|Class)\]\s*/i,''),time:all?'All day':new Date(s).toLocaleTimeString('en-GB',{timeZone:CONFIG.timeZone,hour:'numeric',minute:'2-digit',hour12:true}),description:[e.location,e.description].filter(Boolean).join('\n')};}
function onDate(d){const k=key(d);return items.filter(e=>e.start<=k&&k<e.end);}
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;}
function eventCard(e,showDate=false){let n=node('div',undefined,'event');n.style.setProperty('--c',types[e.type]);n.append(node('small',`${e.type} · ${showDate?fmt(day(e.start),{day:'numeric',month:'short'})+' · ':''}${e.time}`),node('b',e.title));if(e.description)n.append(node('p',e.description));return n;}
function render(){ $('month').textContent=fmt(month,{month:'long',year:'numeric'});$('selected').textContent=fmt(selected,{weekday:'long',day:'numeric',month:'long',year:'numeric'});const c=$('calendar');c.replaceChildren();for(let w of ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'])c.append(node('div',w,'weekday'));for(let i=0;i<month.getDay();i++)c.append(node('div'));const total=new Date(month.getFullYear(),month.getMonth()+1,0).getDate();for(let i=1;i<=total;i++){let d=new Date(month.getFullYear(),month.getMonth(),i),b=node('button',i,'day'+(key(d)===key(today)?' today':'')),ev=onDate(d),dots=node('span',undefined,'dots');b.setAttribute('aria-pressed',String(key(d)===key(selected)));b.setAttribute('aria-label',`${key(d)}, ${ev.length} events`);for(let t of [...new Set(ev.map(e=>e.type))]){let dot=node('span',undefined,'dot');dot.style.background=types[t];dot.title=t;dots.append(dot);}b.append(dots);b.onclick=()=>{selected=d;render()};c.append(b);}let events=$('events');events.replaceChildren();let ev=onDate(selected);if(busy||error)events.append(node('p',busy?'Loading events…':'Schedule unavailable; try refreshing.'));else if(!ev.length)events.append(node('p','No events scheduled.'));else ev.forEach(e=>events.append(eventCard(e)));let upcoming=$('upcoming');upcoming.replaceChildren();let base=demo?day('2026-12-06'):today,u=items.filter(e=>e.end>key(base)&&e.start<key(add(base,7)));if(busy||error)upcoming.append(node('p',busy?'Loading…':'Schedule unavailable.'));else if(!u.length)upcoming.append(node('p','No upcoming events.'));else u.forEach(e=>upcoming.append(eventCard(e,true)));$('status').textContent=demo?'DEMO ONLY — sample events, not your class schedule.':busy?'Loading live calendar…':error?error:'Live Google Calendar · Read-only';$('status').className='status'+(error?' error':'');}
async function load(){let token=++request;error='';if(demo){items=samples;render();return;}busy=true;items=[];render();let first=new Date(month.getFullYear(),month.getMonth(),1),last=new Date(month.getFullYear(),month.getMonth()+1,1),min=key(first)<key(today)?key(first):key(today),max=key(last)>key(add(today,7))?key(last):key(add(today,7));try{let data=[],page='';do{let q=new URLSearchParams({key:CONFIG.apiKey,timeMin:min+'T00:00:00+06:00',timeMax:max+'T00:00:00+06:00',timeZone:CONFIG.timeZone,singleEvents:'true',orderBy:'startTime',maxResults:'2500'});if(page)q.set('pageToken',page);let res=await fetch('https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(CONFIG.calendarId)+'/events?'+q);if(!res.ok)throw Error('Google Calendar returned '+res.status);let j=await res.json();data.push(...(j.items||[]));page=j.nextPageToken||'';}while(page);if(token!==request)return;items=data.filter(e=>e.status!=='cancelled').map(convert).filter(Boolean);}catch(e){if(token!==request)return;error='Unable to load live calendar. Check connection and calendar settings.';}if(token===request){busy=false;render();}}
for(let [t,color] of Object.entries(types)){let s=node('span'),d=node('i',undefined,'dot');d.style.background=color;s.append(d,document.createTextNode(t));$('legend').append(s);}
function move(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);selected=month;load();} $('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('today').onclick=()=>{selected=today;month=new Date(today.getFullYear(),today.getMonth(),1);load()};load();
</script></body></html>
